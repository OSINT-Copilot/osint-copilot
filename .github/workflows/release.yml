name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.metadata.outputs.app-version }}
      extension-version: ${{ steps.metadata.outputs.extension-version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate versions and private packages
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const readPackage = path => JSON.parse(readFileSync(path, 'utf8'))
          const root = readPackage('package.json')
          const app = readPackage('apps/tangent-electron/package.json')
          const extension = readPackage('apps/osint-copilot-extension/package.json')
          const extensionManifest = readPackage('apps/osint-copilot-extension/static/manifest.json')
          const lock = readPackage('package-lock.json')
          const versionPattern = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/

          for (const [name, pkg] of [['root', root], ['desktop', app], ['extension', extension]]) {
            if (!versionPattern.test(pkg.version)) throw new Error(`${name} has an invalid version: ${pkg.version}`)
            if (pkg.private !== true) throw new Error(`${name} package must be private`)
          }

          for (const packagePath of [
            'apps/tangent-test-workspace-generator',
            'apps/tangent-website',
            'packages/tangent-html-to-markdown',
            'packages/tangent-query-parser',
          ]) {
            if (readPackage(`${packagePath}/package.json`).private !== true) {
              throw new Error(`${packagePath} package must be private`)
            }
          }

          if (extensionManifest.version !== extension.version) {
            throw new Error(`extension manifest ${extensionManifest.version} does not match package ${extension.version}`)
          }
          if (lock.packages['apps/tangent-electron'].version !== app.version) {
            throw new Error('desktop version does not match package-lock.json')
          }
          if (lock.packages['apps/osint-copilot-extension'].version !== extension.version) {
            throw new Error('extension version does not match package-lock.json')
          }

          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `v${app.version}`) {
            throw new Error(`tag ${process.env.RELEASE_TAG} does not match desktop version v${app.version}`)
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `app-version=${app.version}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `extension-version=${extension.version}\n`)
          console.log(`desktop ${app.version}; extension ${extension.version}`)
          NODE

  test:
    name: Release tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-and-build

      - name: Typecheck OSINT code
        run: npm run typecheck:osint --workspace=apps/tangent-electron

      - name: Typecheck browser extension
        run: npm run typecheck --workspace=apps/osint-copilot-extension

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Run unit and integration tests
        run: npx vitest run
        working-directory: apps/tangent-electron

      - name: Build development app for end-to-end tests
        run: npm run build:dev
        working-directory: apps/tangent-electron

      - name: Allow Chromium's user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run end-to-end tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:end-to-end -- --grep-invert "the real extension sends"
        working-directory: apps/tangent-electron

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-release
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/tangent-electron/test-results/
            apps/tangent-electron/playwright-report/

  build-linux:
    name: Package Linux and extension
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-and-build

      - name: Package Linux without publishing
        run: npm run package:linux --workspace=apps/tangent-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package browser extension
        run: npm run zip --workspace=apps/osint-copilot-extension

      # The fictional demo investigation, so people who only download the app can open it.
      - name: Package demo investigation
        run: |
          set -euo pipefail
          mkdir -p release-assets
          (cd demo && zip -qr -X "../release-assets/osint-copilot-demo-operation-northgate.zip" "Operation Northgate" README.md)

      - name: Stage and checksum Linux artifacts
        env:
          APP_VERSION: ${{ needs.validate.outputs.app-version }}
          EXTENSION_VERSION: ${{ needs.validate.outputs.extension-version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          cp apps/tangent-electron/dist/*.AppImage release-assets/
          cp apps/tangent-electron/dist/*.deb release-assets/
          cp apps/tangent-electron/dist/*.rpm release-assets/
          cp apps/tangent-electron/dist/latest*.yml release-assets/
          blockmaps=(apps/tangent-electron/dist/*.blockmap)
          if (( ${#blockmaps[@]} )); then cp "${blockmaps[@]}" release-assets/; fi
          cp apps/osint-copilot-extension/release/*.zip release-assets/

          test -f "release-assets/osint-copilot-$APP_VERSION-x86_64.AppImage"
          test -f "release-assets/osint-copilot-$APP_VERSION-arm64.AppImage"
          test -f "release-assets/osint-copilot_$APP_VERSION_amd64.deb"
          test -f "release-assets/osint-copilot-$APP_VERSION.x86_64.rpm"
          test -f release-assets/latest-linux.yml
          test -f release-assets/latest-linux-arm64.yml
          test -f "release-assets/osint-copilot-extension-$EXTENSION_VERSION.zip"
          test -f release-assets/osint-copilot-demo-operation-northgate.zip
          node scripts/release-checksums.mjs release-assets SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osint-copilot-linux
          if-no-files-found: error
          retention-days: 14
          path: release-assets/

  build-windows:
    name: Package Windows (x64 and arm64)
    needs: [validate, test]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-and-build

      # Release builds are intentionally credential-free. Code signing can be added later as
      # an isolated step/job; signing credentials must never be exposed to install or build.
      - name: Package Windows without publishing
        run: npm run package:win --workspace=apps/tangent-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Stage and checksum Windows artifacts
        shell: bash
        env:
          APP_VERSION: ${{ needs.validate.outputs.app-version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp apps/tangent-electron/dist/*.exe release-assets/
          cp apps/tangent-electron/dist/*.blockmap release-assets/
          cp apps/tangent-electron/dist/latest*.yml release-assets/

          test -f "release-assets/OSINT-Copilot-Setup-$APP_VERSION.exe"
          test -f "release-assets/OSINT-Copilot-Setup-$APP_VERSION.exe.blockmap"
          test -f "release-assets/OSINT-Copilot-Portable-$APP_VERSION.exe"
          test -f release-assets/latest.yml
          node scripts/release-checksums.mjs release-assets SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osint-copilot-windows
          if-no-files-found: error
          retention-days: 14
          path: release-assets/

  assemble:
    name: Verify release bundle
    needs: [validate, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: osint-copilot-*
          path: release-assets
          merge-multiple: true

      - name: Verify and consolidate checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check --strict SHA256SUMS-linux.txt
          sha256sum --check --strict SHA256SUMS-windows.txt
          rm SHA256SUMS-linux.txt SHA256SUMS-windows.txt
          cd ..
          node scripts/release-checksums.mjs release-assets SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osint-copilot-release
          if-no-files-found: error
          retention-days: 30
          path: release-assets/

  # Opt-in: set the repository variable PUBLISH_RELEASES to "true" once the protected
  # "release" environment holds RELEASES_TOKEN. Until then a tag run builds, tests and
  # checksums the artifacts (downloadable from the run) and stops short of publishing.
  publish:
    name: Create draft release
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.PUBLISH_RELEASES == 'true'
    needs: [validate, assemble]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: osint-copilot-release
          path: release-assets

      - name: Publish draft to the public update feed
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_REPOSITORY: OSINT-Copilot/osint-copilot-releases
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists in $RELEASE_REPOSITORY" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$RELEASE_REPOSITORY" \
            --draft \
            --title "OSINT Copilot $RELEASE_TAG" \
            --notes "Source: https://github.com/${{ github.repository }}/tree/$SOURCE_SHA"
