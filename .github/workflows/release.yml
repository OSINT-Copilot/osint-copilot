# Builds OSINT Copilot on each platform natively, which macOS in particular requires.
#
# Two modes, chosen by whether RELEASES_TOKEN is set:
#
#   * with it, each job publishes into a draft release in the public releases repository
#     (see `publish` in apps/tangent-electron/electron-builder.json), which is what the
#     in-app updater reads. A draft reaches nobody until it is published by hand.
#   * without it, each job only packages, and attaches the installers to this run. That is
#     the mode to use before the signing certificates exist: the builds are unsigned, and
#     unsigned builds should not go to users.
#
# GITHUB_TOKEN cannot be used for the publish: it is scoped to this repository, and the
# releases live in another one. RELEASES_TOKEN must be a token with contents:write there.
#
# Signing is likewise switchable, and off while the secrets are absent:
#   * macOS: APPLE_CSC_LINK (base64 .p12) and APPLE_CSC_KEY_PASSWORD sign it; APPLE_ID,
#     APPLE_TEAM_ID and APPLE_ID_PASSWORD notarize it (build/after-sign.js).
#   * Windows: AZURE_KEY_VAULT_URL and the four variables beside it sign through
#     AzureSignTool (build/sign-windows.js).
name: Release

on:
  push:
    tags:
      - 'v*'
  # Build the three platforms from any branch without minting a version. Publishing still
  # depends on RELEASES_TOKEN, so a manual run normally just leaves artifacts behind.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate. Linux, because that is where the end-to-end suite is known to hold: it drives
  # a real window, and macOS has failures of its own (see test-macos) that no release should
  # wait on while nothing is shipped for macOS.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-and-build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps --only-shell

      - name: Unit tests
        run: npx vitest run
        working-directory: apps/tangent-electron

      # The setup action builds for production, and only a development build honours
      # OSINT_SKIP_LICENSE. A runner holds no licence, so against a production build every
      # window is the licence gate and the whole suite times out waiting for the workspace.
      # A developer's own machine hides this: their profile has a real licence.
      - name: Build (development) for the end-to-end run
        run: npm run build:dev
        working-directory: apps/tangent-electron

      # A real window needs a display; the runner has none.
      - name: End-to-end tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:end-to-end
        working-directory: apps/tangent-electron

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-linux
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/tangent-electron/test-results/
            apps/tangent-electron/playwright-report/

  # Not a gate, and known to fail: 8 canvas tests never see the OSINT runtime start, and
  # upstream's Note Linking disagrees. Nothing is shipped for macOS yet, so this runs to keep
  # the failures visible and to collect the reports that will say why.
  test-macos:
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-and-build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps --only-shell

      - name: Test
        run: npm run test
        working-directory: apps/tangent-electron

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-macos
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/tangent-electron/test-results/
            apps/tangent-electron/playwright-report/

  build:
    needs: test
    strategy:
      # One platform failing should not cancel the other two: an unsigned Windows build is
      # still worth having when macOS is what broke.
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runs-on: macos-26
          - platform: win
            runs-on: windows-latest
          - platform: linux
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-and-build

      # Only needed once Windows signing is configured; build/sign-windows.js calls it.
      - name: Install AzureSignTool
        if: matrix.platform == 'win' && env.AZURE_KEY_VAULT_URL != ''
        run: dotnet tool install --global AzureSignTool

      - name: Publish ${{ matrix.platform }}
        if: env.RELEASES_TOKEN != ''
        run: npm run publish:${{ matrix.platform }}
        working-directory: apps/tangent-electron
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          # Without a certificate, build unsigned rather than hunting for an identity that
          # is not on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_CSC_LINK != '' }}
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}

      - name: Package ${{ matrix.platform }} (no releases token, so nothing is published)
        if: env.RELEASES_TOKEN == ''
        run: npm run package:${{ matrix.platform }}
        working-directory: apps/tangent-electron
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          # Without a certificate, build unsigned rather than hunting for an identity that
          # is not on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_CSC_LINK != '' }}
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # The installers themselves, not the unpacked trees electron-builder leaves beside
      # them, and not the blockmaps the updater generates.
      - uses: actions/upload-artifact@v4
        with:
          name: osint-copilot-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/tangent-electron/dist/*.AppImage
            apps/tangent-electron/dist/*.deb
            apps/tangent-electron/dist/*.dmg
            apps/tangent-electron/dist/*.zip
            apps/tangent-electron/dist/*.exe
            apps/tangent-electron/dist/latest*.yml
