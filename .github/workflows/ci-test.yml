name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-and-build

      - name: Typecheck OSINT code
        run: npm run typecheck:osint --workspace=apps/tangent-electron

      - name: Typecheck browser extension
        run: npm run typecheck --workspace=apps/osint-copilot-extension

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps --only-shell

      - name: Run unit and integration tests
        run: npx vitest run

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-ci
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/tangent-electron/test-results/
            apps/tangent-electron/playwright-report/

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The hosted Gitleaks action requires a paid licence for organisation repositories.
      # Installing the open-source CLI directly keeps this check free and reproducible.
      - name: Install Gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$GITLEAKS_URL" --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks

      - name: Scan Git history for secrets
        run: "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner
