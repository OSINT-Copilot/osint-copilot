name: Setup and Build
description: Checks out the repo, sets up Node, installs dependencies, and builds.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        # Version downgrade forced by https://github.com/nodejs/node/issues/63487
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    # Downloads the binary and proves it runs. Not `electron --version`, which starts a
    # browser process: on an Ubuntu 24.04 runner that aborts on the SUID sandbox, because
    # the image blocks the unprivileged user namespace Chromium's sandbox wants. Run as
    # Node, the same binary answers without a sandbox at all.
    - name: Install Electron binary
      run: ELECTRON_RUN_AS_NODE=1 npx electron -p "'Electron ' + process.versions.electron"
      shell: bash

    - name: Build
      run: npm run build:tangent-electron
      shell: bash
