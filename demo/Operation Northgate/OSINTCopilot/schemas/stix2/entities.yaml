# STIX 2.1–oriented entity types (starter set)
version: 1
family: stix2
entityTypes:
  - name: threat-actor
    label: Threat Actor
    plural: Threat Actors
    description: Individual or group posing a threat.
    color: "#c62828"
    labelField: name
    required: [name]
    featured: [name, description, aliases]
    properties:
      name: { label: Name, type: string }
      description: { label: Description, type: text }
      aliases: { label: Aliases, type: text }

  - name: intrusion-set
    label: Intrusion Set
    plural: Intrusion Sets
    description: Group of adversary behavior and resources.
    color: "#6a1b9a"
    labelField: name
    required: [name]
    featured: [name, description]
    properties:
      name: { label: Name, type: string }
      description: { label: Description, type: text }

  - name: malware
    label: Malware
    plural: Malware
    description: Malicious code or family.
    color: "#d84315"
    labelField: name
    required: [name]
    featured: [name, description]
    properties:
      name: { label: Name, type: string }
      description: { label: Description, type: text }

  - name: tool
    label: Tool
    plural: Tools
    description: Software used for legitimate or malicious purposes.
    color: "#ef6c00"
    labelField: name
    required: [name]
    featured: [name, description]
    properties:
      name: { label: Name, type: string }
      description: { label: Description, type: text }

  - name: campaign
    label: Campaign
    plural: Campaigns
    description: Group of intrusion activities.
    color: "#00838f"
    labelField: name
    required: [name]
    featured: [name, description]
    properties:
      name: { label: Name, type: string }
      description: { label: Description, type: text }

  - name: indicator
    label: Indicator
    plural: Indicators
    description: Observable pattern for detection.
    color: "#1565c0"
    labelField: name
    required: [name]
    featured: [name, pattern, description]
    properties:
      name: { label: Name, type: string }
      pattern: { label: Pattern, type: string }
      description: { label: Description, type: text }

  - name: ipv4-addr
    label: IPv4 Address
    plural: IPv4 Addresses
    description: IPv4 observable.
    color: "#2e7d32"
    labelField: value
    required: [value]
    featured: [value]
    properties:
      value: { label: Address, type: string }

  - name: domain-name
    label: Domain Name
    plural: Domain Names
    description: Domain observable.
    color: "#37474f"
    labelField: value
    required: [value]
    featured: [value]
    properties:
      value: { label: Domain, type: string }

  - name: url
    label: URL
    plural: URLs
    description: URL observable.
    color: "#455a64"
    labelField: value
    required: [value]
    featured: [value]
    properties:
      value: { label: URL, type: string }
