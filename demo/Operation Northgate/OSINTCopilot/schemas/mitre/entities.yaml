# MITRE ATT&CK–oriented entity types (starter set)
version: 1
family: mitre
entityTypes:
  - name: attack-pattern
    label: Technique
    plural: Techniques
    description: ATT&CK technique or sub-technique behavior.
    color: "#c62828"
    labelField: name
    required: [name]
    featured: [name, external_id, description]
    properties:
      name: { label: Name, type: string }
      external_id: { label: External ID, type: string }
      description: { label: Description, type: text }

  - name: mitre-tactic
    label: Tactic
    plural: Tactics
    description: ATT&CK tactic (TAxxxx).
    color: "#6a1b9a"
    labelField: name
    required: [name]
    featured: [name, external_id]
    properties:
      name: { label: Name, type: string }
      external_id: { label: External ID, type: string }
      description: { label: Description, type: text }

  - name: mitre-group
    label: Group
    plural: Groups
    description: Threat group (intrusion set in ATT&CK).
    color: "#283593"
    labelField: name
    required: [name]
    featured: [name, aliases, description]
    properties:
      name: { label: Name, type: string }
      aliases: { label: Aliases, type: text }
      description: { label: Description, type: text }

  - name: mitre-software
    label: Software
    plural: Software
    description: Software entry in ATT&CK (tool or malware).
    color: "#ef6c00"
    labelField: name
    required: [name]
    featured: [name, external_id]
    properties:
      name: { label: Name, type: string }
      external_id: { label: External ID, type: string }
      description: { label: Description, type: text }

  - name: mitre-data-source
    label: Data Source
    plural: Data Sources
    description: ATT&CK data source for detections.
    color: "#00838f"
    labelField: name
    required: [name]
    featured: [name, description]
    properties:
      name: { label: Name, type: string }
      description: { label: Description, type: text }
